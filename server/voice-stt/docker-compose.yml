services:
  voice-stt:
    build: .
    container_name: voice-stt
    restart: unless-stopped
    ports:
      - "127.0.0.1:8770:8770"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
